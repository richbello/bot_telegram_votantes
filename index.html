<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Puesto de Votación · Soacha 2027</title>
<style>
  :root{--bg:#0f1720;--card:#16212d;--bot:#1f2d3b;--user:#1e7a4f;--txt:#e8eef4;--mut:#8aa0b4;--acc:#2fbf71}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);
       min-height:100vh;display:flex;justify-content:center;padding:16px}
  .app{width:100%;max-width:520px;background:var(--card);border-radius:16px;display:flex;flex-direction:column;
       height:calc(100vh - 32px);overflow:hidden;box-shadow:0 10px 40px #0006}
  header{padding:16px 18px;border-bottom:1px solid #ffffff12}
  header h1{margin:0;font-size:1.05rem}
  header p{margin:4px 0 0;color:var(--mut);font-size:.82rem}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;line-height:1.4;white-space:pre-line;font-size:.95rem}
  .bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
  .user{background:var(--user);align-self:flex-end;border-bottom-right-radius:4px}
  .msg a{color:var(--acc)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
  .quick button{background:transparent;border:1px solid #ffffff2a;color:var(--txt);padding:7px 11px;border-radius:999px;cursor:pointer;font-size:.85rem}
  .quick button:hover{border-color:var(--acc)}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff12}
  input{flex:1;background:#0f1720;border:1px solid #ffffff22;color:var(--txt);padding:11px 13px;border-radius:10px;font-size:1rem}
  input:focus{outline:2px solid var(--acc);border-color:transparent}
  form button{background:var(--acc);border:0;color:#062;font-weight:700;padding:0 16px;border-radius:10px;cursor:pointer}
  form button:disabled{opacity:.5}
  .panel{min-width:280px;white-space:normal}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .kpis div{background:#0f1720;border-radius:8px;padding:8px;text-align:center}
  .kpis b{display:block;font-size:1.25rem;color:var(--acc)}
  .kpis span{font-size:.72rem;color:var(--mut)}
  .panel h4{margin:12px 0 6px;font-size:.8rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .row{display:grid;grid-template-columns:1fr 70px 92px;gap:8px;align-items:center;font-size:.8rem;padding:3px 0}
  .row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar{height:6px;background:#0f1720;border-radius:3px;overflow:hidden}
  .row .bar span{display:block;height:100%;background:var(--acc)}
  .row .num{text-align:right;white-space:nowrap}
  .row .num small{color:var(--mut)}
  .panel h4 + .row:not(:has(.bar)), .panel .row:not(:has(.bar)){grid-template-columns:1fr auto}
  .upd{color:var(--mut);font-size:.72rem;margin:10px 0 0}
  footer{color:var(--mut);font-size:.72rem;text-align:center;padding:0 12px 10px}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>🗳️ Consulta de Puesto de Votación</h1>
    <p>Soacha 2027 · Datos de ejemplo (ficticios)</p>
  </header>

  <section id="msgs" aria-live="polite"></section>

  <div class="quick">
    <button data-modo="cedula">🔎 Consultar mi puesto</button>
    <button data-modo="pin">👥 Coordinadores</button>
    <button data-modo="privacidad">🔒 Privacidad</button>
  </div>

  <form id="f" autocomplete="off">
    <input id="in" inputmode="numeric" placeholder="Escriba su número de cédula" aria-label="Mensaje">
    <button id="send">Enviar</button>
  </form>
  <footer>Esta página no contiene la base de datos: cada consulta se resuelve en el servidor.</footer>
</main>

<script>
  // ← URL de tu Worker después de `wrangler deploy`
  const API = "https://puestos-soacha-api.richbello.workers.dev";

  const msgs = document.getElementById("msgs");
  const input = document.getElementById("in");
  const send = document.getElementById("send");
  let modo = "cedula";

  function add(text, who = "bot", html = false) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    html ? (d.innerHTML = text) : (d.textContent = text);
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function setModo(m) {
    modo = m;
    if (m === "cedula") {
      input.type = "text"; input.inputMode = "numeric"; input.placeholder = "Escriba su número de cédula";
      add("Escriba su número de cédula (solo números).");
    } else if (m === "pin") {
      input.type = "password"; input.inputMode = "numeric"; input.placeholder = "PIN de coordinador";
      add("Ingrese su PIN de coordinador.");
    } else {
      add("Solo consultamos la cédula que usted escribe y devolvemos su puesto y mesa. " +
          "No mostramos listados ni guardamos su número: el registro de auditoría usa una huella cifrada. " +
          "Tratamiento de datos conforme a la Ley 1581 de 2012.");
      modo = "cedula";
    }
    input.focus();
  }

  async function consultar(cedula) {
    const r = await fetch(`${API}/api/puesto?cedula=${encodeURIComponent(cedula)}`);
    const d = await r.json();
    if (!d.ok) return add("⚠️ " + d.error);
    if (!d.encontrado) return add("No encontramos esa cédula en nuestra base. Verifique el número o consulte en la Registraduría.");
    const mapa = d.lat && d.lng ? `<br><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" rel="noopener">📍 Ver en el mapa</a>` : "";
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    add(`✅ Cédula ${esc(d.cedula)}<br><b>${esc(d.puesto)}</b><br>Mesa ${esc(d.mesa)}<br>${esc(d.direccion)}<br>${esc(d.municipio)}${mapa}`, "bot", true);
  }

  async function coordinador(pin) {
    const r = await fetch(`${API}/api/coordinador`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin })
    });
    const d = await r.json();
    if (!d.ok) return add("⚠️ " + d.error);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const foco = d.municipio_foco || "SOACHA";
    const puestos = d.por_puesto_foco || [];
    const max = Math.max(1, ...puestos.map(p => p.votantes));
    const filas = puestos.map(p => `
      <div class="row">
        <div class="lbl" title="${esc(p.puesto)}">${esc(p.puesto)}</div>
        <div class="bar"><span style="width:${Math.round(p.votantes / max * 100)}%"></span></div>
        <div class="num">${p.votantes}<small> · ${p.mesas} mesa${p.mesas === 1 ? "" : "s"}</small></div>
      </div>`).join("");
    const muni = Object.entries(d.por_municipio || {}).map(([m, n]) =>
      `<div class="row"><div class="lbl">${esc(m)}</div><div class="num">${n}</div></div>`).join("");
    add(`<div class="panel">
      <div class="kpis">
        <div><b>${d.total_votantes}</b><span>votantes</span></div>
        <div><b>${d.votantes_foco ?? "–"}</b><span>en ${esc(foco)}</span></div>
        <div><b>${puestos.length}</b><span>puestos ${esc(foco)}</span></div>
      </div>
      <h4>${esc(foco)} por puesto</h4>${filas || "<p>Sin registros.</p>"}
      <h4>Por municipio</h4>${muni}
      <p class="upd">Actualizado ${esc(d.actualizado)}</p>
    </div>`, "bot", true);
    setModo("cedula");
  }

  document.querySelectorAll(".quick button").forEach(b => b.onclick = () => setModo(b.dataset.modo));

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    input.value = "";
    add(modo === "pin" ? "••••" : v, "user");
    send.disabled = true;
    try {
      if (modo === "pin") await coordinador(v);
      else {
        const ced = v.replace(/\D/g, "");
        if (ced.length < 5 || ced.length > 10) add("Eso no parece una cédula. Escriba solo los números (5 a 10 dígitos).");
        else await consultar(ced);
      }
    } catch {
      add("⚠️ No pudimos conectar con el servidor. Intente de nuevo.");
    } finally { send.disabled = false; input.focus(); }
  };

  add("Hola 👋 Soy el asistente de la campaña. Le ayudo a encontrar su puesto de votación.");
  setModo("cedula");
</script>
</body>
</html>
