<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Dónde voto? Soacha 2027</title>
<meta name="description" content="Consulte su puesto y su mesa para las elecciones de 2027 en Soacha. Escriba su cédula y vea dónde votar.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://richbello.github.io/bot_telegram_votantes/">
<meta property="og:title" content="¿Dónde voto? Soacha 2027">
<meta property="og:description" content="Escriba su cédula y vea su puesto y su número de mesa.">
<meta property="og:image" content="https://richbello.github.io/bot_telegram_votantes/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0E6B57">
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0F2A3D; --muted:#5E6F7E; --line:#E2E7ED;
    --pri:#0E6B57; --pri-ink:#FFFFFF; --pri-soft:#E3F1EC; --gold:#B8892B; --err:#B42318; --err-soft:#FDECEA;
    --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Figtree", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
       -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
  .app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
  @media (min-width:600px){
    body{padding:24px 0}
    .app{height:calc(100dvh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(15,42,61,.06),0 24px 60px -20px rgba(15,42,61,.25)}
  }
  :focus-visible{outline:3px solid #7CC4AE;outline-offset:2px}

  /* Encabezado */
  header{background:var(--pri);color:var(--pri-ink);padding:18px 20px 22px;display:flex;align-items:flex-start;gap:12px;
         padding-top:max(18px, env(safe-area-inset-top))}
  header .t{flex:1;min-width:0}
  header h1{margin:0;font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
  header p{margin:8px 0 0;font-size:.92rem;opacity:.85}
  header .prueba{display:inline-block;margin-top:10px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.16)}
  #toggle{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:600;white-space:nowrap}
  #toggle:hover{background:rgba(255,255,255,.22)}

  /* Botones y campos */
  .btn{font:inherit;font-size:.86rem;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);
       padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
  .btn:hover{border-color:#C5CED8}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;border-radius:14px}
  .btn.pri:hover{background:#0B5A49}
  .btn.sm{padding:5px 11px;font-size:.78rem}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;font-size:1rem;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);
       padding:12px 14px;border-radius:14px;width:100%}
  input::placeholder,textarea::placeholder{color:#97A4B0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
  .view{flex:1;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none!important}

  /* Chat */
  #msgs{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:12px 15px;border-radius:20px;white-space:pre-line;font-size:1rem}
  .bot{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px;border:1px solid var(--line)}
  .user{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;font-weight:600;letter-spacing:.02em}
  .msg a{color:var(--pri);font-weight:600}
  .msg.rich{padding:0;background:none;border:0;max-width:100%;width:100%;white-space:normal}

  /* Pase de votación */
  .pase{background:var(--surface);border-radius:24px;border:1px solid var(--line);overflow:hidden;
        box-shadow:0 1px 2px rgba(15,42,61,.05),0 14px 30px -18px rgba(15,42,61,.35)}
  .pase-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--pri-soft);
        color:var(--pri);font-size:.8rem;font-weight:700}
  .pase-cuerpo{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 18px 18px;align-items:end}
  .pase h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15;letter-spacing:-.01em}
  .pase .dir{margin:0;color:var(--muted);font-size:.92rem}
  .pase-mesa{text-align:center;border-left:2px dashed var(--line);padding-left:16px}
  .pase-mesa small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
  .pase-mesa b{display:block;font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:.9;color:var(--gold);letter-spacing:-.04em}
  .pase-pie{display:flex;gap:8px;padding:0 18px 18px}
  .pase-pie a{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:14px;font-weight:700;font-size:.92rem}
  .pase-pie .ir{background:var(--pri);color:#fff}
  .pase-pie .otra{background:var(--bg);color:var(--ink);cursor:pointer}
  @media (prefers-reduced-motion:no-preference){
    .pase{animation:aparece .45s cubic-bezier(.2,.8,.2,1)}
    @keyframes aparece{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  }

  .quick{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
  .quick .btn{flex:none}
  .app.modo-equipo header{padding-bottom:16px}
  .app.modo-equipo header h1{font-size:1.4rem}
  .app.modo-equipo header p,.app.modo-equipo header .prueba{display:none}
  .app.compacto header{padding-bottom:16px}
  .app.compacto header h1{font-size:1.4rem}
  .app.compacto header p,.app.compacto header .prueba{display:none}
  form.bar{display:flex;gap:8px;padding:12px 14px;background:var(--surface);border-top:1px solid var(--line);
           padding-bottom:max(12px, env(safe-area-inset-bottom))}
  form.bar input{flex:1;font-size:1.1rem;padding:14px 16px;letter-spacing:.03em}
  form.bar .btn.pri{padding:0 20px;font-size:1rem}
  footer{color:var(--muted);font-size:.74rem;text-align:center;padding:0 16px 10px;background:var(--surface)}

  /* Equipo */
  #equipo{overflow-y:auto;padding:18px 16px 28px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 12px;font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .who{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .who .quien{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .who b{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  #refrescar{font-size:1rem;padding:5px 12px}
  .tag{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
  .kpis div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px}
  .kpis b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em}
  .kpis span{display:block;margin-top:6px;font-size:.76rem;color:var(--muted);line-height:1.25}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:5px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--muted);margin:10px 0}
  .chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pri);flex:none}
  .note{font-size:.88rem;padding:10px 12px;border-radius:12px;margin:10px 0;background:var(--bg)}
  .note.ok{background:var(--pri-soft);color:var(--pri);font-weight:600}
  .note.err{background:var(--err-soft);color:var(--err);font-weight:600}
  .pinbox{background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:16px;text-align:center;margin-bottom:12px}
  .pinbox b{display:block;font-family:var(--display);font-size:2.4rem;font-weight:800;letter-spacing:.18em;color:var(--ink);margin:6px 0}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:.78rem;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;white-space:nowrap}
  .off{opacity:.45}
  .row{display:grid;grid-template-columns:1fr 64px 86px;gap:10px;align-items:center;font-size:.86rem;padding:5px 0}
  .row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .barra{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
  .row .barra span{display:block;height:100%;background:var(--pri);border-radius:4px}
  .row .num{text-align:right;white-space:nowrap;font-weight:700}
  .row .num small{color:var(--muted);font-weight:500}
  .empty{color:var(--muted);font-size:.9rem}
  .card .empty{margin-top:0}
  #l_txt{min-height:120px;resize:vertical}
  .cuenta{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px}
  .buscar{margin-bottom:8px}
  .lista{list-style:none;margin:0;padding:0}
  .persona{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .persona:last-child{border-bottom:0}
  .p-info{min-width:0}
  .p-info b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-info span{font-size:.8rem;color:var(--muted)}
  .p-num{text-align:right}
  .p-num b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:800;line-height:1}
  .p-num span{font-size:.72rem;color:var(--muted)}
  .acc{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="t">
      <h1>¿Dónde voto?</h1>
      <p>Consulte su puesto y mesa para las elecciones de 2027 en Soacha.</p>
      <span class="prueba">Datos de prueba</span>
    </div>
    <button class="btn" id="toggle">Equipo</button>
  </header>

  <!-- Vista pública: chat -->
  <section class="view" id="chat">
    <div id="msgs" aria-live="polite"></div>
    <div class="quick">
      <button class="btn" data-modo="privacidad">Cómo usamos sus datos</button>
    </div>
    <form class="bar" id="f" autocomplete="off">
      <input id="in" inputmode="numeric" placeholder="Número de cédula" aria-label="Número de cédula">
      <button class="btn pri" id="send">Buscar</button>
    </form>
    <footer>Solo mostramos el puesto de la cédula que usted escribe.</footer>
  </section>

  <!-- Vista equipo -->
  <section class="view hidden" id="equipo"></section>
</main>

<script>
  const API = "https://puestos-soacha-api.richbello.workers.dev";

  // ───────── utilidades ─────────
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ROL = { candidato: "Candidato", coordinador: "Coordinador", gestor: "Gestor" };
  let sesion = null;
  try { sesion = JSON.parse(sessionStorage.getItem("sesion") || "null"); } catch {}
  const guardarSesion = (s) => { sesion = s; try { s ? sessionStorage.setItem("sesion", JSON.stringify(s)) : sessionStorage.removeItem("sesion"); } catch {} };

  async function api(path, { method = "GET", body } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (sesion?.token) headers.Authorization = "Bearer " + sesion.token;
    const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({ ok: false, error: "Respuesta inválida del servidor." }));
    if (r.status === 401 && sesion && path !== "/api/login") { guardarSesion(null); render(); }
    return d;
  }

  // ───────── chat público ─────────
  const msgs = $("#msgs"), input = $("#in"), send = $("#send");
  function add(text, who = "bot", html = false) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    html ? (d.innerHTML = text) : (d.textContent = text);
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  document.querySelectorAll("[data-modo]").forEach((b) => b.onclick = () => {
    if (b.dataset.modo === "privacidad") {
      add("Solo consultamos la cédula que usted escribe y devolvemos su puesto y mesa. No mostramos listados. " +
          "Tratamiento de datos conforme a la Ley 1581 de 2012.");
    } else add("Escriba el número de cédula, sin puntos ni espacios.");
    input.focus();
  });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const ced = input.value.replace(/\D/g, "");
    if (!input.value.trim()) return;
    add(input.value.trim(), "user"); input.value = "";
    document.querySelector(".app").classList.add("compacto");
    if (ced.length < 5 || ced.length > 10) return add("Ese número no parece una cédula. Escriba entre 5 y 10 dígitos, sin puntos.");
    send.disabled = true;
    try {
      const d = await api(`/api/puesto?cedula=${ced}`);
      if (!d.ok) add("⚠️ " + d.error);
      else if (!d.encontrado) add("Esa cédula no está en nuestra base. Revise el número o consulte su puesto en la página de la Registraduría.");
      else {
        const mapa = d.lat && d.lng ? `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}` : "";
        add(`<div class="pase" role="group" aria-label="Su puesto de votación">
          <div class="pase-cab"><span>Su puesto de votación</span><span>Cédula ${esc(d.cedula)}</span></div>
          <div class="pase-cuerpo">
            <div><h3>${esc(d.puesto)}</h3><p class="dir">${esc(d.direccion)}<br>${esc(d.municipio)}</p></div>
            <div class="pase-mesa"><small>Mesa</small><b>${esc(d.mesa)}</b></div>
          </div>
          <div class="pase-pie">
            ${mapa ? `<a class="ir" href="${mapa}" target="_blank" rel="noopener">Cómo llegar</a>` : ""}
            <a class="otra" data-otra>Otra cédula</a>
          </div></div>`, "bot rich", true);
        const otra = [...msgs.querySelectorAll("[data-otra]")].pop();
        if (otra) otra.onclick = () => input.focus();
      }
    } catch { add("⚠️ No pudimos conectar con el servidor. Intente de nuevo."); }
    finally { send.disabled = false; input.focus(); }
  };
  add("Hola. Escriba su número de cédula, sin puntos ni espacios, y le mostramos dónde le toca votar.");

  // ───────── navegación ─────────
  let vista = "chat";
  $("#toggle").onclick = () => { vista = vista === "chat" ? "equipo" : "chat"; render(); };

  function render() {
    $("#chat").classList.toggle("hidden", vista !== "chat");
    $("#equipo").classList.toggle("hidden", vista !== "equipo");
    $("#toggle").textContent = vista === "chat" ? "Equipo" : "Consulta";
    document.querySelector(".app").classList.toggle("modo-equipo", vista === "equipo");
    if (vista === "equipo") sesion ? cargarPanel() : pintarLogin();
  }

  // ───────── login ─────────
  function pintarLogin(error = "") {
    $("#equipo").innerHTML = `
      <div class="card">
        <h3>Ingreso del equipo</h3>
        <p class="empty">Escriba el código y el PIN que le entregó su coordinador.</p>
        <form id="flogin" autocomplete="off">
          <div class="field"><label>Código de usuario</label><input id="lusr" maxlength="12" placeholder="G-014 · K-003 · CANDIDATO" autocapitalize="characters"></div>
          <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="10" placeholder="••••••"></div>
          ${error ? `<div class="note err">${esc(error)}</div>` : ""}
          <button class="btn pri" style="width:100%;padding:10px">Ingresar</button>
        </form>
      </div>`;
    let ultimo = ""; try { ultimo = localStorage.getItem("usuario") || ""; } catch {}
    $("#lusr").value = ultimo;
    (ultimo ? $("#pin") : $("#lusr")).focus();
    $("#flogin").onsubmit = async (e) => {
      e.preventDefault();
      let usuario = $("#lusr").value.trim().toUpperCase().replace(/\s+/g, "");
      if (/^[KG]\d+$/.test(usuario)) usuario = usuario[0] + "-" + usuario.slice(1).padStart(3, "0");
      if (!usuario) return pintarLogin("Escriba su código de usuario.");
      const d = await api("/api/login", { method: "POST", body: { usuario, pin: $("#pin").value } });
      if (!d.ok) return pintarLogin(d.error);
      try { localStorage.setItem("usuario", usuario); } catch {}
      guardarSesion({ token: d.token, usuario: d.usuario });
      cargarPanel();
    };
  }

  // ───────── panel ─────────
  let flash = null; // mensaje o PIN a mostrar tras recargar el panel
  let ultimoLote = null; // resultado de la última carga masiva (PINs), visible hasta que se cierre
  async function cargarPanel() {
    $("#equipo").innerHTML = `<p class="empty">Cargando…</p>`;
    const d = await api("/api/panel");
    if (!d.ok) return sesion ? ($("#equipo").innerHTML = `<div class="note err">${esc(d.error)}</div>`) : pintarLogin(d.error);
    const u = d.usuario;
    let html = `<div class="who"><div class="quien"><b>${esc(u.nombre)}</b>
        ${u.rol !== "candidato" ? `<span class="tag">${ROL[u.rol]} ${esc(u.id)}</span>` : ""}</div>
      <button class="btn sm" id="refrescar" aria-label="Actualizar datos" title="Actualizar datos">↻</button>
      <button class="btn sm" id="salir">Salir</button></div>`;
    html += flashHtml() + loteHtml();
    if (u.rol === "gestor") html += panelGestor(d);
    else html += panelEquipo(d, u);
    $("#equipo").innerHTML = html;
    $("#salir").onclick = () => { guardarSesion(null); ultimoLote = null; pintarLogin(); };
    $("#refrescar").onclick = () => cargarPanel();
    if (u.rol === "gestor") enlazarGestor();
    else enlazarEquipo(d, u);
  }

  function flashHtml() {
    if (!flash) return "";
    const f = flash; flash = null;
    if (f.pin) return `<div class="pinbox">PIN de <b style="font-size:1rem;letter-spacing:0;display:inline">${esc(f.nombre)}</b> (${esc(f.id)})
      <b>${esc(f.pin)}</b><span class="empty">Ingresa con el código <b style="font-size:.85rem;letter-spacing:0;display:inline">${esc(f.id)}</b> y este PIN. Entréguelo en persona: no se volverá a mostrar.</span></div>`;
    return `<div class="note ${f.err ? "err" : "ok"}">${esc(f.texto)}</div>`;
  }

  function loteHtml() {
    if (!ultimoLote) return "";
    const { creados, errores } = ultimoLote;
    return `<div class="card" style="border:1px dashed var(--acc)">
      <h3>Resultado de la carga · ${creados.length} creados${errores.length ? ` · ${errores.length} con error` : ""}</h3>
      ${creados.length ? `<p class="empty">Descargue la lista y entregue cada PIN en persona. Los PIN no se vuelven a mostrar.</p>
        <button class="btn pri" id="lote_csv" style="width:100%;padding:9px;margin-bottom:8px">⬇ Descargar lista de PIN (Excel/CSV)</button>
        <table><tr><th>Código</th><th>Nombre</th><th>Rol</th><th class="n">PIN</th></tr>
        ${creados.map((c) => `<tr><td>${esc(c.id)}</td><td>${esc(c.nombre)}${c.coordinador ? `<br><small class="empty">${esc(c.coordinador)}</small>` : ""}</td>
          <td>${ROL[c.rol]}</td><td class="n"><b>${esc(c.pin)}</b></td></tr>`).join("")}</table>` : ""}
      ${errores.length ? `<div class="note err">${errores.map((e) => `Fila ${e.fila}${e.nombre ? " (" + esc(e.nombre) + ")" : ""}: ${esc(e.error)}`).join("<br>")}</div>` : ""}
      <button class="btn sm" id="lote_cerrar" style="margin-top:8px">Cerrar (ya guardé los PIN)</button>
    </div>`;
  }

  function descargarLote() {
    const filas = [["Codigo", "Nombre", "Rol", "Coordinador", "PIN"],
      ...ultimoLote.creados.map((c) => [c.id, c.nombre, ROL[c.rol], c.coordinador || "", { pin: c.pin }])];
    // El PIN va como ="012345" para que Excel no borre los ceros iniciales
    const celda = (v) => v && v.pin ? `"=""${v.pin}"""` : `"${String(v).replace(/"/g, '""')}"`;
    const csv = "\ufeff" + filas.map((f) => f.map(celda).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `pines_equipo_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function barras(lista) {
    if (!lista?.length) return `<p class="empty">Aún no hay votantes registrados.</p>`;
    const max = Math.max(1, ...lista.map((p) => p.votantes));
    return lista.map((p) => `<div class="row"><div class="lbl" title="${esc(p.puesto)} · ${esc(p.municipio)}">${esc(p.puesto)}</div>
      <div class="barra"><span style="width:${Math.round(p.votantes / max * 100)}%"></span></div>
      <div class="num">${p.votantes}<small> · ${p.mesas} mesa${p.mesas === 1 ? "" : "s"}</small></div></div>`).join("");
  }

  // Gestor
  function panelGestor(d) {
    const filas = d.mis_votantes.map((v) => `<tr><td>${esc(v.cedula)}</td><td>${esc(v.nombre || "—")}</td>
      <td>${esc(v.puesto)}</td><td class="n">${esc(v.mesa)}</td></tr>`).join("");
    return `
      <div class="kpis"><div><b>${d.total}</b><span>mis votantes</span></div></div>
      <div class="card">
        <h3>Registrar votante</h3>
        <form id="freg" autocomplete="off">
          <div class="field"><label>Cédula</label><input id="r_ced" inputmode="numeric" maxlength="12"></div>
          <div id="r_base" class="note hidden"></div>
          <div class="grid2">
            <div class="field"><label>Nombre</label><input id="r_nom" maxlength="80"></div>
            <div class="field"><label>Teléfono</label><input id="r_tel" inputmode="tel" maxlength="20"></div>
          </div>
          <div id="r_manual">
            <div class="field"><label>Puesto de votación</label><input id="r_pue" maxlength="120" placeholder="Consúltelo en la Registraduría"></div>
            <div class="grid2">
              <div class="field"><label>Mesa</label><input id="r_mesa" inputmode="numeric" maxlength="3"></div>
              <div class="field"><label>Municipio</label><input id="r_mun" value="SOACHA" maxlength="60"></div>
            </div>
          </div>
          <label class="chk"><input type="checkbox" id="r_aut">
            <span>El votante autorizó el tratamiento de sus datos personales para fines de la campaña (Ley 1581 de 2012).</span></label>
          <div id="r_msg"></div>
          <button class="btn pri" style="width:100%;padding:10px">Registrar</button>
        </form>
      </div>
      <div class="card"><h3>Mis votantes</h3>
        ${filas ? `<table><tr><th>Cédula</th><th>Nombre</th><th>Puesto</th><th class="n">Mesa</th></tr>${filas}</table>`
                : `<p class="empty">Aún no ha registrado votantes.</p>`}
      </div>`;
  }

  function enlazarGestor() {
    let enBase = false;
    $("#r_ced").onblur = async () => {
      const c = $("#r_ced").value.replace(/\D/g, "");
      const box = $("#r_base");
      if (c.length < 5) { box.classList.add("hidden"); $("#r_manual").classList.remove("hidden"); enBase = false; return; }
      const d = await api(`/api/puesto?cedula=${c}`);
      enBase = !!d.encontrado;
      box.classList.toggle("hidden", !enBase);
      $("#r_manual").classList.toggle("hidden", enBase);
      if (enBase) { box.className = "note ok"; box.textContent = `En la base: ${d.puesto} · mesa ${d.mesa} · ${d.municipio}`; }
    };
    $("#freg").onsubmit = async (e) => {
      e.preventDefault();
      const body = {
        cedula: $("#r_ced").value, nombre: $("#r_nom").value, telefono: $("#r_tel").value,
        puesto: $("#r_pue").value, mesa: $("#r_mesa").value, municipio: $("#r_mun").value,
        autorizacion: $("#r_aut").checked,
      };
      if (!body.autorizacion) return ($("#r_msg").innerHTML = `<div class="note err">Marque la autorización del votante.</div>`);
      const d = await api("/api/votantes", { method: "POST", body });
      if (!d.ok) return ($("#r_msg").innerHTML = `<div class="note err">${esc(d.error)}</div>`);
      flash = { texto: d.mensaje };
      cargarPanel();
    };
  }

  // Coordinador y candidato
  function panelEquipo(d, u) {
    const t = d.totales;
    let kpis = `<div><b>${t.votantes}</b><span>votantes del equipo</span></div>
                <div><b>${t.gestores}</b><span>gestores activos</span></div>
                <div><b>${t.puestos}</b><span>puestos cubiertos</span></div>`;
    if (u.rol === "candidato") kpis = `<div><b>${d.por_coordinador.length}</b><span>coordinadores</span></div>` + kpis +
      `<div><b>${d.base.total}</b><span>en la base</span></div>`;

    const coords = d.por_coordinador || [];
    const nombreCoord = Object.fromEntries(coords.map((c) => [c.id, c.nombre]));

    const crear = u.rol === "candidato" ? `
      <form id="fusr" class="card" autocomplete="off"><h3>Crear usuario</h3>
        <div class="grid2">
          <div class="field"><label>Rol</label><select id="u_rol"><option value="coordinador">Coordinador</option><option value="gestor">Gestor</option></select></div>
          <div class="field"><label>Nombre</label><input id="u_nom" maxlength="80"></div>
        </div>
        <div class="field hidden" id="u_cwrap"><label>Coordinador a cargo</label>
          <select id="u_coord">${coords.filter((c) => c.activo).map((c) => `<option value="${esc(c.id)}">${esc(c.nombre)} (${esc(c.id)})</option>`).join("")}</select></div>
        <div id="u_msg"></div>
        <button class="btn pri" style="width:100%;padding:10px">Crear y generar PIN</button>
      </form>` : `
      <form id="fusr" class="card" autocomplete="off"><h3>Agregar gestor a mi equipo</h3>
        <div class="field"><label>Nombre</label><input id="u_nom" maxlength="80"></div>
        <div id="u_msg"></div>
        <button class="btn pri" style="width:100%;padding:10px">Crear y generar PIN</button>
      </form>`;

    const acciones = (x) => `<div class="acc"><button class="btn sm" data-pin="${esc(x.id)}" data-nom="${esc(x.nombre)}">Nuevo PIN</button>
      <button class="btn sm" data-estado="${esc(x.id)}" data-activo="${x.activo ? 0 : 1}">${x.activo ? "Desactivar" : "Activar"}</button></div>`;
    const persona = (x, detalle) => `<li class="persona ${x.activo ? "" : "off"}" data-buscar="${esc((x.nombre + " " + x.id + " " + detalle).toLowerCase())}">
      <div class="p-info"><b>${esc(x.nombre)}</b><span>${esc(x.id)}${detalle ? " · " + esc(detalle) : ""}${x.activo ? "" : " · desactivado"}</span></div>
      <div class="p-num"><b>${x.votantes}</b><span>votantes</span></div>${acciones(x)}</li>`;

    const tCoord = u.rol === "candidato" ? `<div class="card"><h3>Coordinadores</h3>${coords.length
      ? `<ul class="lista">${coords.map((c) => persona(c, `${c.gestores} gestor${c.gestores === 1 ? "" : "es"}`)).join("")}</ul>`
      : `<p class="empty">Cree el primer coordinador para empezar a armar el equipo.</p>`}</div>` : "";

    const gest = d.por_gestor;
    const tGest = `<div class="card"><h3>${u.rol === "candidato" ? "Gestores" : "Mis gestores"} <small class="cuenta">${gest.length}</small></h3>${gest.length
      ? `${gest.length > 8 ? `<input class="buscar" id="g_buscar" placeholder="Buscar por nombre o código" aria-label="Buscar gestor">` : ""}
         <ul class="lista" id="g_lista">${gest.map((g) => persona(g, u.rol === "candidato" ? (nombreCoord[g.coordinador_id] || "") : "")).join("")}</ul>`
      : `<p class="empty">Aún no hay gestores. Agréguelos uno a uno o con la carga masiva.</p>`}</div>`;

    const masiva = `<form id="flote" class="card" autocomplete="off"><h3>Carga masiva</h3>
      <p class="empty">${u.rol === "candidato"
        ? "Una persona por línea: <b>Nombre ; rol ; coordinador</b>. El rol es coordinador o gestor; el coordinador puede ser su código (K-001) o su nombre exacto, incluso si se crea en esta misma lista. Puede pegar tres columnas copiadas de Excel."
        : "Un gestor por línea, solo el nombre. Quedan a su cargo."} Máximo 100 por carga.</p>
      <textarea id="l_txt" rows="5"
        placeholder="${u.rol === "candidato" ? "Ana Torres; coordinador\nLuis Gómez; gestor; Ana Torres\nMarta Ruiz; gestor; K-001" : "Luis Gómez\nMarta Ruiz"}"></textarea>
      <div id="l_msg"></div>
      <button class="btn pri" style="width:100%;padding:10px;margin-top:6px">Crear todos y generar PIN</button>
    </form>`;

    return `<div class="kpis">${kpis}</div>${crear}${masiva}${tCoord}${tGest}
      <div class="card"><h3>Votantes por puesto</h3>${barras(d.por_puesto)}</div>`;
  }

  function enlazarEquipo(d, u) {
    const rolSel = $("#u_rol");
    if (rolSel) rolSel.onchange = () => $("#u_cwrap").classList.toggle("hidden", rolSel.value !== "gestor");
    $("#fusr").onsubmit = async (e) => {
      e.preventDefault();
      const body = { rol: rolSel ? rolSel.value : "gestor", nombre: $("#u_nom").value, coordinador_id: $("#u_coord")?.value };
      if (body.rol === "gestor" && rolSel && !body.coordinador_id) {
        return ($("#u_msg").innerHTML = `<div class="note err">Primero cree un coordinador.</div>`);
      }
      const r = await api("/api/usuarios", { method: "POST", body });
      if (!r.ok) return ($("#u_msg").innerHTML = `<div class="note err">${esc(r.error)}</div>`);
      flash = { pin: r.pin, nombre: r.usuario.nombre, id: r.usuario.id };
      cargarPanel();
    };
    if ($("#g_buscar")) $("#g_buscar").oninput = (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#g_lista .persona").forEach((li) => li.classList.toggle("hidden", q && !li.dataset.buscar.includes(q)));
    };
    if ($("#lote_csv")) $("#lote_csv").onclick = descargarLote;
    if ($("#lote_cerrar")) $("#lote_cerrar").onclick = () => { ultimoLote = null; cargarPanel(); };
    $("#flote").onsubmit = async (e) => {
      e.preventDefault();
      const lineas = $("#l_txt").value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lineas.length) return ($("#l_msg").innerHTML = `<div class="note err">Pegue al menos un nombre.</div>`);
      const filas = lineas.map((l) => {
        const [nombre, rol, coordinador] = l.split(/\t|;/).map((x) => (x || "").trim());
        return u.rol === "candidato" ? { nombre, rol: (rol || "gestor").toLowerCase(), coordinador } : { nombre, rol: "gestor" };
      });
      const btn = e.submitter; if (btn) { btn.disabled = true; btn.textContent = "Creando…"; }
      const r = await api("/api/usuarios/lote", { method: "POST", body: { filas } });
      if (!r.ok) { if (btn) { btn.disabled = false; btn.textContent = "Crear todos y generar PIN"; }
        return ($("#l_msg").innerHTML = `<div class="note err">${esc(r.error)}</div>`); }
      ultimoLote = r;
      cargarPanel();
    };
    document.querySelectorAll("[data-estado]").forEach((b) => b.onclick = async () => {
      const r = await api(`/api/usuarios/${b.dataset.estado}/estado`, { method: "POST", body: { activo: b.dataset.activo === "1" } });
      flash = r.ok ? { texto: `Usuario ${b.dataset.estado} ${b.dataset.activo === "1" ? "activado" : "desactivado"}.` } : { texto: r.error, err: true };
      cargarPanel();
    });
    document.querySelectorAll("[data-pin]").forEach((b) => b.onclick = async () => {
      const r = await api(`/api/usuarios/${b.dataset.pin}/pin`, { method: "POST" });
      flash = r.ok ? { pin: r.pin, nombre: b.dataset.nom, id: b.dataset.pin } : { texto: r.error, err: true };
      cargarPanel();
    });
  }

  // Enlace de acceso del equipo: ?equipo=1 abre el ingreso; &u=G-003 deja el código escrito
  try {
    const qs = new URLSearchParams(location.search);
    const cod = (qs.get("u") || "").trim().toUpperCase();
    if (qs.has("equipo") || cod) {
      vista = "equipo";
      if (/^(CANDIDATO|[KG]-\d{3,})$/.test(cod)) { try { localStorage.setItem("usuario", cod); } catch {} }
      history.replaceState(null, "", location.pathname);
    }
  } catch {}
  render();
</script>
</body>
</html>
